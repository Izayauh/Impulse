# ============================================================================
# WhisperLocal Automated Release Workflow
# Builds and publishes installer when a version tag is pushed
# ============================================================================
#
# Usage:
#   git tag v1.0.0 -m "Release v1.0.0"
#   git push origin v1.0.0
#
# This workflow will:
#   1. Build the installer using PyInstaller and Inno Setup
#   2. Calculate SHA256 checksum
#   3. Create GitHub Release with installer attached
#
# ============================================================================

name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0, v1.2.3, etc.
      - 'v*.*.*-*'  # Trigger on prerelease tags like v1.0.0-beta.1

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write  # Required to create releases

jobs:
  build:
    name: Build Installer
    runs-on: windows-latest
    
    steps:
      # ========================================
      # Checkout and Setup
      # ========================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}"
          }
          $versionNumber = $version -replace '^v', ''
          $isPrerelease = if ($versionNumber.Contains('-')) { 'true' } else { 'false' }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "VERSION_NUMBER=$versionNumber" >> $env:GITHUB_OUTPUT
          echo "IS_PRERELEASE=$isPrerelease" >> $env:GITHUB_OUTPUT
          echo "Building version: $version ($versionNumber)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ========================================
      # Install Dependencies
      # ========================================
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # Download Inno Setup
          $url = "https://jrsoftware.org/download.php/is.exe"
          $output = "$env:TEMP\innosetup.exe"
          
          Write-Host "Downloading Inno Setup..."
          Invoke-WebRequest -Uri $url -OutFile $output -UseBasicParsing
          
          Write-Host "Installing Inno Setup silently..."
          Start-Process -FilePath $output -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          
          # Add to PATH
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          echo "$innoPath" >> $env:GITHUB_PATH
          
          Write-Host "Inno Setup installed at: $innoPath"

      # ========================================
      # Download Required Files
      # ========================================
      - name: Download whisper.cpp binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "runtime\bin" -Force | Out-Null

          # Check if whisper-cli.exe exists, if not download from whisper.cpp releases
          if (-not (Test-Path "runtime\bin\whisper-cli.exe")) {
            Write-Host "whisper-cli.exe not found, downloading from whisper.cpp..."
            
            # Download latest whisper.cpp Windows release
            $releaseUrl = "https://api.github.com/repos/ggerganov/whisper.cpp/releases/latest"
            $release = Invoke-RestMethod -Uri $releaseUrl
            
            # Find Windows CUDA asset
            $asset = $release.assets | Where-Object { $_.name -like "*win*cuda*" -or $_.name -like "*windows*" } | Select-Object -First 1
            
            if ($asset) {
              Write-Host "Downloading: $($asset.name)"
              Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "whisper-release.zip"
              Expand-Archive -Path "whisper-release.zip" -DestinationPath "whisper-temp" -Force
              
              # Copy required files
              Get-ChildItem -Path "whisper-temp" -Recurse -Include "*.exe", "*.dll" | 
                ForEach-Object { Copy-Item $_.FullName -Destination "runtime\bin" -Force }
              
              Remove-Item "whisper-release.zip", "whisper-temp" -Recurse -Force
            } else {
              Write-Warning "Could not find Windows release asset"
              exit 1
            }
          }
          
          # List available files
          Write-Host "`nFiles in runtime\bin:"
          Get-ChildItem "runtime\bin" -Filter "*.exe" | ForEach-Object { Write-Host "  EXE: $($_.Name)" }
          Get-ChildItem "runtime\bin" -Filter "*.dll" | ForEach-Object { Write-Host "  DLL: $($_.Name)" }

      - name: Download AI models
        shell: pwsh
        run: |
          # Create models directory
          New-Item -ItemType Directory -Path "runtime\models" -Force | Out-Null
          
          $models = @{
            "ggml-base.en.bin" = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin"
            "ggml-medium.en.bin" = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium.en.bin"
            "ggml-large-v3.bin" = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3.bin"
          }
          
          foreach ($model in $models.GetEnumerator()) {
            $path = "runtime\models\$($model.Key)"
            if (-not (Test-Path $path)) {
              Write-Host "Downloading $($model.Key)..."
              # Use aria2c for faster downloads if available, otherwise Invoke-WebRequest
              try {
                Invoke-WebRequest -Uri $model.Value -OutFile $path -UseBasicParsing
                $size = (Get-Item $path).Length / 1MB
                $sizeText = "{0:N0} MB" -f $size
                Write-Host "  Downloaded: $($model.Key) ($sizeText)"
              } catch {
              Write-Warning "Failed to download $($model.Key): $_"
              exit 1
              }
            } else {
              Write-Host "Model already exists: $($model.Key)"
            }
          }

      - name: Validate release runtime assets
        shell: pwsh
        run: |
          $requiredFiles = @(
            "runtime\bin\whisper-cli.exe",
            "runtime\bin\ggml-base.dll",
            "runtime\bin\ggml-cpu.dll",
            "runtime\bin\ggml.dll",
            "runtime\bin\whisper.dll",
            "runtime\models\ggml-base.en.bin",
            "runtime\models\ggml-medium.en.bin",
            "runtime\models\ggml-large-v3.bin"
          )

          foreach ($path in $requiredFiles) {
            if (-not (Test-Path $path)) {
              Write-Error "Missing required release asset: $path"
              exit 1
            }
          }

          Write-Host "Runtime asset validation passed."

      # ========================================
      # Update Version Numbers
      # ========================================
      - name: Update version in files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION_NUMBER }}"

          # Update installer.iss version
          $issPath = "scripts\release\installer.iss"
          $issContent = Get-Content $issPath -Raw
          $issContent = $issContent -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`""
          Set-Content $issPath $issContent

          # Update build_config.spec version
          $specPath = "scripts\release\build_config.spec"
          $specContent = Get-Content $specPath -Raw
          $specContent = $specContent -replace "APP_VERSION = '.*'", "APP_VERSION = '$version'"
          Set-Content $specPath $specContent

          Write-Host "Updated version to: $version"

      # ========================================
      # Build
      # ========================================
      - name: Build with PyInstaller
        shell: pwsh
        env:
          WHISPER_TELEMETRY_TOKEN: ${{ secrets.WHISPER_TELEMETRY_TOKEN }}
        run: |
          Write-Host "Building WhisperLocal with PyInstaller..."
          python -m PyInstaller --clean --noconfirm --distpath dist --workpath build scripts\release\build_config.spec
          
          # Verify output
          if (Test-Path "dist\WhisperLocal\WhisperLocal.exe") {
            $size = (Get-Item "dist\WhisperLocal\WhisperLocal.exe").Length / 1MB
            $sizeText = "Build successful! Size: {0:N1} MB" -f $size
            Write-Host $sizeText
          } else {
            Write-Error "Build failed - WhisperLocal.exe not found"
            exit 1
          }

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          Write-Host "Building installer with Inno Setup..."
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q scripts\release\installer.iss
          
          # Find and verify installer
          $installer = Get-ChildItem -Path "dist" -Filter "WhisperLocal-Setup-*.exe" | 
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          
          if ($installer) {
            $size = $installer.Length / 1GB
            $sizeText = "{0:N2} GB" -f $size
            Write-Host "Installer created: $($installer.Name) ($sizeText)"
            echo "INSTALLER_NAME=$($installer.Name)" >> $env:GITHUB_OUTPUT
            echo "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "Installer build failed - no installer found in dist/"
            exit 1
          }
        id: installer

      - name: Calculate checksums
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist" -Filter "WhisperLocal-Setup-*.exe" | 
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          
          $hash = (Get-FileHash -Path $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $hashFile = "dist\$($installer.BaseName).sha256"
          
          "$hash *$($installer.Name)" | Out-File -FilePath $hashFile -Encoding ascii
          
          Write-Host "SHA256: $hash"
          echo "CHECKSUM=$hash" >> $env:GITHUB_OUTPUT
          echo "CHECKSUM_FILE=$hashFile" >> $env:GITHUB_OUTPUT
        id: checksum

      - name: Create full release package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\release\create_release_package.ps1 -Version "${{ steps.version.outputs.VERSION_NUMBER }}"

          $package = Get-ChildItem -Path "dist" -Filter "WhisperLocal-Setup-*-Complete.zip" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1

          if (-not $package) {
            Write-Error "Full release package ZIP was not created."
            exit 1
          }

          $packageHash = "$($package.FullName).sha256"
          if (-not (Test-Path $packageHash)) {
            Write-Error "Full release package checksum was not created: $packageHash"
            exit 1
          }

          $stablePackage = "dist\Impulse-Windows-Beta.zip"
          $stablePackageHash = "dist\Impulse-Windows-Beta.zip.sha256"
          Copy-Item $package.FullName $stablePackage -Force
          Copy-Item $packageHash $stablePackageHash -Force

          echo "PACKAGE_NAME=$($package.Name)" >> $env:GITHUB_OUTPUT
          echo "PACKAGE_PATH=$($package.FullName)" >> $env:GITHUB_OUTPUT
          echo "PACKAGE_HASH=$packageHash" >> $env:GITHUB_OUTPUT
          echo "STABLE_PACKAGE=$stablePackage" >> $env:GITHUB_OUTPUT
          echo "STABLE_PACKAGE_HASH=$stablePackageHash" >> $env:GITHUB_OUTPUT
        id: package

      # ========================================
      # Create Release
      # ========================================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: WhisperLocal ${{ steps.version.outputs.VERSION }}
          body: |
            ## WhisperLocal ${{ steps.version.outputs.VERSION }}
            
            Privacy-focused, GPU-accelerated speech-to-text dictation for Windows.
            
            ### Installation
            
            1. Download `Impulse-Windows-Beta.zip` below
            2. Extract **all** files to the same folder
            3. Run `WhisperLocal-Setup-${{ steps.version.outputs.VERSION_NUMBER }}.exe`
            4. Keep the `.bin` files beside the installer until setup finishes
            5. Start dictating with `WIN + CTRL`!
            
            ### System Requirements
            
            - Windows 10 or 11 (64-bit)
            - 4 GB RAM minimum (8 GB recommended)
            - 4 GB disk space
            - NVIDIA GPU with CUDA recommended (CPU also works)
            
            ### Checksums
            
            - Installer EXE SHA256: `${{ steps.checksum.outputs.CHECKSUM }}`
            - Full package ZIP SHA256: see the attached `.sha256` file
            
            ### What's New
            
            See [CHANGELOG.md](https://github.com/Izayauh/whisper/blob/main/CHANGELOG.md) for details.
            
          files: |
            dist/WhisperLocal-Setup-*-Complete.zip
            dist/WhisperLocal-Setup-*-Complete.zip.sha256
            dist/Impulse-Windows-Beta.zip
            dist/Impulse-Windows-Beta.zip.sha256
          draft: false
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " Release Created Successfully!"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Version: ${{ steps.version.outputs.VERSION }}"
          Write-Host "Installer: ${{ steps.installer.outputs.INSTALLER_NAME }}"
          Write-Host "Installer SHA256: ${{ steps.checksum.outputs.CHECKSUM }}"
          Write-Host "Package: ${{ steps.package.outputs.PACKAGE_NAME }}"
          Write-Host ""
          Write-Host "Stable download URL:"
          Write-Host "  https://github.com/Izayauh/whisper/releases/latest/download/Impulse-Windows-Beta.zip"
          Write-Host ""

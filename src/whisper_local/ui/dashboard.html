<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impulse Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script src="dashboard_stats.js" onerror="console.log('No exported stats file')"></script>
</head>

<body>
  <div id="toast-container"></div>
  <div id="paywall-overlay" class="paywall" style="display: none;">
    <div class="card paywall-card">
      <h2>Activation Required</h2>
      <p>Please enter your license key to unlock Impulse.</p>
      <input type="text" id="paywall-key" class="field" placeholder="License Key" autocomplete="off" spellcheck="false">
      <button class="btn primary" onclick="activateFromPaywall()">Activate License</button>
      <p id="paywall-error" class="paywall-error" style="display: none;"></p>
    </div>
  </div>

  <div id="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-tile" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="3" width="6" height="11" rx="3"></rect>
            <path d="M5 11a7 7 0 0 0 14 0"></path>
            <path d="M12 18v3"></path>
          </svg>
        </div>
        <h1>Impulse</h1>
      </div>

      <nav class="sidebar-nav">
        <button id="nav-home" class="nav-item active" onclick="switchView('home')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M4 19V9l8-6 8 6v10"></path>
            <path d="M10 19v-6h4v6"></path>
          </svg>
          <span>Home</span>
        </button>
        <button id="nav-snippets" class="nav-item" onclick="switchView('snippets')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M4 7h16"></path>
            <path d="M4 12h10"></path>
            <path d="M4 17h7"></path>
          </svg>
          <span>Snippets</span>
          <span id="snippet-count" class="nav-count" data-bind="snippets.length">0</span>
        </button>
        <button id="nav-dictionary" class="nav-item" onclick="switchView('dictionary')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"></path>
            <path d="M4 20.5V5.5"></path>
          </svg>
          <span>Dictionary</span>
          <span id="dictionary-count" class="nav-count" data-bind="vocabularyWords.length">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button id="nav-settings" class="nav-item" onclick="openSettings()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
          </svg>
          <span>Settings</span>
        </button>
        <div class="sidebar-listening">
          <span class="live-dot" aria-hidden="true"></span>
          <span>Listening for <span id="listening-hotkey"></span></span>
        </div>
      </div>
    </aside>

    <main class="main-panel">
      <div id="tab-content"></div>
    </main>
  </div>

  <script>
    let currentView = 'home';
    let settingsTab = 'general';
    let pythonPollingStarted = false;
    let lastStatsDigest = '';
    let lastRecentDigest = '';
    let lastModelSettingsDigest = '';
    let lastVocabularyDigest = '';
    let lastSidebarDigest = '';
    let lastHotkeyDigest = '';
    let lastSnippetsDigest = '';
    let lastUserSettingsDigest = '';
    const PY_POLL_MS = 3000;
    let renderQueued = false;
    let pollBusy = false;
    let pollTick = 0;
    let hotkeyRecording = false;
    let hotkeyCapturePressed = new Set();
    let hotkeyCaptureDraft = [];
    // Settings page state. ollamaReachable gates the stylization rows and is
    // probed once each time the view opens; licenseEditingForKey is the key
    // the Change button was pressed for, so a successful activation (which
    // changes the key) drops the field on its own.
    let ollamaReachable = false;
    let appVersion = '';
    let licenseEditingForKey = null;

    let licenseState = { active: false, is_valid: false, key: null, reason: null, message: null, expires_at: null };

    // Everything Home renders. Zeros and empty arrays until a loader fills
    // them, so a fresh install shows no activity rather than fake activity.
    //   todayWords, todayTakes, bestDay, totalWords, totalSessions, avgWpm
    //     come from Bridge.stats.getHomeSummary() (SQLite);
    //   last14Days from Bridge.stats.getChartData(14) (SQLite);
    //   dayStreak from Bridge.stats.get() (JSON stats file);
    //   recentTranscripts from Bridge.stats.getHistory() (JSON stats file).
    let stats = {
      todayWords: 0,
      todayTakes: 0,
      bestDay: { words: 0, date: null },
      totalWords: 0,
      totalSessions: 0,
      avgWpm: 0,
      dayStreak: 0,
      last14Days: [],
      recentTranscripts: []
    };

    // Empty until Bridge.settings.getSnippets() / getVocabulary() fill them,
    // so a fresh install shows no snippets rather than sample ones.
    let snippets = [];
    let vocabularyWords = [];
    const settingsState = {
      launchBehavior: 'start_minimized',
      theme: 'system',
      commandMode: true,
      autoCopy: true,
      microphone: 'Default System Microphone',
      vadSensitivity: 65,
      vadSilenceMs: 700,
      modelMode: 'auto',
      manualModel: 'base',
      activeModel: 'base',
      vramTotalGb: 0,
      hotkey: 'ctrl+windows',
      stylizationProfile: 'clean',
      ollamaModel: 'llama3.2:3b',
      ollamaEndpoint: 'http://127.0.0.1:11434',
      telemetryEnabled: false
    };
    const microphones = ['Default System Microphone', 'USB Audio Interface', 'Headset Microphone', 'Webcam Microphone'];

    const esc = (v) => String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const digest = (v) => { try { return JSON.stringify(v); } catch { return String(Date.now()); } };
    const fmtInt = (n) => Math.round(Number(n) || 0).toLocaleString('en-US');
    const modelLabel = (m) => {
      const map = { auto: 'Auto', turbo: 'Turbo', fast: 'Fast', base: 'Base', small: 'Small', medium: 'Medium', large: 'Large' };
      return map[String(m || '').toLowerCase()] || 'Base';
    };
    const hotkeyPartLabel = (part) => {
      const key = String(part || '').toLowerCase();
      const map = { ctrl: 'Ctrl', alt: 'Alt', shift: 'Shift', windows: 'Win', space: 'Space', esc: 'Esc', enter: 'Enter', tab: 'Tab' };
      return map[key] || (key.length === 1 ? key.toUpperCase() : key.toUpperCase());
    };
    const hotkeyDisplay = (value) => {
      const parts = String(value || '').split('+').map((p) => p.trim()).filter(Boolean);
      return parts.map(hotkeyPartLabel).join(' + ');
    };
    const betaExpiryMessage = () => {
      const days = Number(licenseState.beta_expiry_days);
      if (!Number.isFinite(days)) return '';
      if (days <= 0) return 'Beta access expires today.';
      return `Beta access expires in ${days} day${days === 1 ? '' : 's'}.`;
    };
    const hotkeyTokenFromEvent = (e) => {
      if (!e || typeof e.key !== 'string') return '';
      const raw = e.key.trim().toLowerCase();
      const map = {
        control: 'ctrl',
        ctrl: 'ctrl',
        alt: 'alt',
        shift: 'shift',
        meta: 'windows',
        win: 'windows',
        command: 'windows',
        cmd: 'windows',
        ' ': 'space',
        spacebar: 'space',
        escape: 'esc',
        return: 'enter',
        arrowup: 'up',
        arrowdown: 'down',
        arrowleft: 'left',
        arrowright: 'right'
      };
      const mapped = map[raw] || raw;
      const compact = mapped.replace(/\s+/g, '');
      if (/^[a-z0-9]$/.test(compact)) return compact;
      if (/^f([1-9]|1[0-9]|2[0-4])$/.test(compact)) return compact;
      if (/^numpad[0-9]$/.test(compact)) return compact;
      if (['ctrl', 'alt', 'shift', 'windows', 'space', 'tab', 'enter', 'esc', 'backspace', 'delete', 'insert', 'home', 'end', 'pageup', 'pagedown', 'up', 'down', 'left', 'right', 'capslock'].includes(compact)) return compact;
      return '';
    };
    const orderHotkeyTokens = (tokens) => {
      const unique = Array.from(new Set((tokens || []).filter(Boolean)));
      const order = ['ctrl', 'alt', 'shift', 'windows'];
      const mods = order.filter((k) => unique.includes(k));
      const rest = unique.filter((k) => !order.includes(k));
      return [...mods, ...rest];
    };
    const isValidHotkeyTokens = (tokens) => {
      const ordered = orderHotkeyTokens(tokens);
      if (ordered.length < 2) return false;
      return ordered.some((k) => k === 'ctrl' || k === 'alt' || k === 'shift' || k === 'windows');
    };

    // ================================================================
    // Bridge abstraction (Research $7) -- single entry-point for all
    // Python backend calls.  Wraps pywebview.api with readiness checks
    // and error handling in one place.
    // ================================================================
    const Bridge = (() => {
      function api() { return window.pywebview && window.pywebview.api; }

      async function invoke(getter) {
        const a = api();
        if (!a) return null;
        try { return await getter(a); } catch (e) { console.warn('[Bridge]', e); return null; }
      }

      return {
        ready: () => Boolean(api()),

        settings: {
          getAll: () => invoke(a => a.get_user_settings()),
          update: (k, v) => invoke(a => a.update_user_setting(k, v)),
          getHotkey: () => invoke(a => a.get_hotkey()),
          setHotkey: (h) => invoke(a => a.set_hotkey(h)),
          getVocabulary: () => invoke(a => a.get_vocabulary()),
          addWord: (w) => invoke(a => a.add_vocabulary_word(w)),
          getSnippets: () => invoke(a => a.get_snippets()),
          addSnippet: (t, r) => invoke(a => a.add_snippet(t, r)),
          deleteSnippet: (id) => invoke(a => a.delete_snippet(id)),
          checkOllama: () => invoke(a => a.check_ollama()),
          getAppVersion: () => invoke(a => a.get_app_version()),
        },

        transcription: {
          getModelMode: () => invoke(a => a.get_model_mode()),
          setModelMode: (m) => invoke(a => a.set_model_mode(m)),
          loadModel: (m) => invoke(a => a.transcription ? a.transcription.load_model(m) : null),
          getLoadingStatus: () => invoke(a => a.transcription ? a.transcription.get_loading_status() : null),
        },

        stats: {
          get: () => invoke(a => a.get_stats()),
          getHomeSummary: () => invoke(a => a.stats ? a.stats.get_home_summary() : null),
          getChartData: (d) => invoke(a => a.stats ? a.stats.get_chart_data(d || 14) : null),
          getHistory: () => invoke(a => a.get_transcription_history()),
        },

        system: {
          minimize: () => invoke(a => a.minimize()),
          close: () => invoke(a => a.close()),
          copyText: (t) => invoke(a => a.copy_text(t)),
          exportCsv: () => invoke(a => a.export_data_csv()),
          ping: () => invoke(a => a.bridge_ping()),
        },
        licensing: {
          getStatus: () => invoke(a => a.licensing ? a.licensing.get_status() : null),
          activate: (key) => invoke(a => a.licensing ? a.licensing.activate(key) : null),
          deactivate: () => invoke(a => a.licensing ? a.licensing.deactivate() : null),
        },
      };
    })();

    // Async Python -> JS event callbacks (Research $7.3).
    // TranscriptionController pushes events via evaluate_js().
    window.bridgeEvents = {
      onLoadProgress(pct) {
        console.log('[bridgeEvents] load progress:', pct, '%');
      },
      onModelLoaded(modelName) {
        showToast('Model loaded: ' + modelLabel(modelName));
        loadModelSettingsFromPython();
      },
      onError(msg) {
        console.error('[bridgeEvents] error:', msg);
        showToast('Error: ' + String(msg));
      },
    };

    /**
     * StatsController.get_chart_data(14) -> stats.last14Days.
     * Input:  {dates: ["2026-08-19", ...], datasets: [{data: [620, ...]}]}
     * Output: [{date: "2026-08-19", words: 620}, ...], oldest first, today last.
     */
    function chartDataToSeries(chartData) {
      if (!chartData || !Array.isArray(chartData.dates)) return null;
      const values = (chartData.datasets && chartData.datasets[0] && chartData.datasets[0].data) || [];
      return chartData.dates.map((date, i) => ({ date: String(date), words: Number(values[i]) || 0 }));
    }

    function updateSidebar() {
      const snapshot = {
        snippets: String(snippets.length),
        dictionary: String(vocabularyWords.length),
      };
      const currentDigest = digest(snapshot);
      if (currentDigest === lastSidebarDigest) return;
      lastSidebarDigest = currentDigest;

      const sc = document.getElementById('snippet-count');
      const dc = document.getElementById('dictionary-count');
      if (sc) sc.textContent = snapshot.snippets;
      if (dc) dc.textContent = snapshot.dictionary;
    }

    function updateListeningLabel() {
      const el = document.getElementById('listening-hotkey');
      if (el) el.textContent = hotkeyDisplay(settingsState.hotkey);
    }

    function updateNav() {
      ['home', 'snippets', 'dictionary', 'settings'].forEach((v) => {
        const b = document.getElementById('nav-' + v);
        if (!b) return;
        b.classList.toggle('active', v === currentView);
      });
    }

    function scheduleRender() {
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(() => {
        renderQueued = false;
        renderContent();
      });
    }

    function renderIfCurrentViewIn(views) {
      if (views.includes(currentView)) scheduleRender();
    }

    function isSettingsTabVisible(tab) { return currentView === 'settings' && settingsTab === tab; }
    function isModelsSettingsVisible() { return isSettingsTabVisible('models'); }

    function switchView(v) {
      currentView = v;
      scheduleRender();
      if (v === 'dictionary') loadVocabularyFromPython();
      if (v === 'snippets') loadSnippetsFromPython();
      if (v === 'settings') { loadOllamaReachability(); loadAppVersion(); }
    }

    // ================================================================
    // Home view. Layout and values lifted from
    // docs/design/canvas-2026-09/Main.dc.html: header row, hero card
    // (words today + record bar + three-column strip), 14-day graph,
    // recent dictations. Each sub-renderer owns one card.
    // ================================================================

    const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>';
    const TYPING_WPM = 40;

    const kbdCaps = (keys) => keys.map((k) => `<span class="kbd">${esc(k)}</span>`).join('');
    const shortDate = (iso) => {
      const d = new Date(String(iso) + 'T12:00:00');
      return isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    };

    function renderHomeHeader() {
      const today = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
      const recordKeys = hotkeyDisplay(settingsState.hotkey).split(' + ').filter(Boolean);
      return `
    <header class="home-head">
      <div class="home-title">
        <h2>Today</h2>
        <span class="home-date">${esc(today)}</span>
      </div>
      <div class="home-hint">
        <span>Hold</span>${kbdCaps(recordKeys)}<span>and talk</span>
        <span class="home-hint-divider" aria-hidden="true"></span>
        ${kbdCaps([...recordKeys, 'Alt'])}<span>hands-free</span>
      </div>
    </header>`;
    }

    /**
     * Hero card: words today, dictation count, record bar against the best
     * day, then Speed / Time saved / Streak.
     *   speed      = avgWpm from the store; "--" until a take has measured one
     *   time saved = todayWords / 40 - todayWords / avgWpm, minutes, floored at 0
     *   streak     = stats.dayStreak, subline is all-time words
     */
    function renderHeroCard() {
      const words = Number(stats.todayWords) || 0;
      const takes = Number(stats.todayTakes) || 0;
      const best = Number(stats.bestDay && stats.bestDay.words) || 0;
      const avgWpm = Number(stats.avgWpm) || 0;
      const streak = Number(stats.dayStreak) || 0;

      // bestDay includes today, so a record day reads words === best.
      let recordPct = 0;
      let recordText = 'No best day yet';
      if (best > 0 && words >= best) {
        recordPct = 100;
        recordText = 'New best day';
      } else if (best > 0) {
        recordPct = Math.min(100, Math.round((words / best) * 100));
        recordText = `${recordPct}% of your best day, ${fmtInt(best)}`;
      }

      const hasSpeed = avgWpm > 0;
      const speedValue = hasSpeed ? `${fmtInt(avgWpm)} <span class="unit">wpm</span>` : '--';
      const speedSub = hasSpeed ? `${(avgWpm / TYPING_WPM).toFixed(1)}x typing` : 'no data yet';
      const savedMin = hasSpeed ? Math.max(0, words / TYPING_WPM - words / avgWpm) : null;
      const savedValue = hasSpeed ? `${fmtInt(savedMin)} <span class="unit">min</span>` : '--';
      const savedSub = hasSpeed ? 'estimate' : 'no data yet';

      return `
    <section class="card hero" data-source="Bridge.stats.getHomeSummary">
      <div class="hero-words">
        <span class="label">Words today</span>
        <div class="hero-count">
          <span class="hero-number mono">${fmtInt(words)}</span>
          <span class="label">${fmtInt(takes)} ${takes === 1 ? 'dictation' : 'dictations'}</span>
        </div>
        <div class="hero-record">
          <span class="rec"><i style="width:${recordPct}%;"></i></span>
          <span class="mono rec-text">${esc(recordText)}</span>
        </div>
      </div>
      <div class="hero-divider" aria-hidden="true"></div>
      <div class="hero-strip">
        <div class="stat">
          <span class="label">Speed</span>
          <span class="value mono">${speedValue}</span>
          <span class="delta">${esc(speedSub)}</span>
        </div>
        <div class="stat">
          <span class="label">Time saved</span>
          <span class="value mono">${savedValue}</span>
          <span class="delta">${esc(savedSub)}</span>
        </div>
        <div class="stat">
          <span class="label">Streak</span>
          <span class="value mono">${fmtInt(streak)} <span class="unit">${streak === 1 ? 'day' : 'days'}</span></span>
          <span class="delta">${fmtInt(stats.totalWords)} all time</span>
        </div>
      </div>
    </section>`;
    }

    /**
     * Last 14 days. Bars scale to the best day so the tallest possible bar
     * meets the dashed best-day line; today's bar is accent and keeps its
     * tooltip open. Data: Bridge.stats.getChartData(14) -> stats.last14Days.
     */
    function renderChartCard() {
      const series = Array.isArray(stats.last14Days) ? stats.last14Days : [];
      const best = Number(stats.bestDay && stats.bestDay.words) || 0;
      const barMaxPx = 88;
      const total = series.reduce((sum, d) => sum + (Number(d.words) || 0), 0);
      const avg = series.length ? Math.round(total / series.length) : 0;
      const bars = series.map((d, i) => {
        const w = Number(d.words) || 0;
        const h = (best > 0 && w > 0) ? Math.max(2, Math.round((w / best) * barMaxPx)) : 2;
        const isToday = i === series.length - 1;
        return `<div class="bar${isToday ? ' today' : ''}" title="${esc(shortDate(d.date))}"><i style="height:${h}px;"><span class="tip mono">${fmtInt(w)}</span></i></div>`;
      }).join('');
      const first = series.length ? shortDate(series[0].date) : '';
      const mid = series.length > 2 ? shortDate(series[Math.floor(series.length / 2)].date) : '';
      return `
    <section class="card chart" data-source="Bridge.stats.getChartData">
      <div class="chart-head">
        <div class="chart-title"><h3>Last 14 days</h3><span>words per day</span></div>
        <span class="mono chart-avg">avg ${fmtInt(avg)} / day</span>
      </div>
      <div class="bars">
        <span class="best"><span class="mono">best day ${fmtInt(best)}</span></span>
        ${bars}
      </div>
      <div class="axis mono">
        <span>${esc(first)}</span><span>${esc(mid)}</span><span class="axis-today">Today</span>
      </div>
    </section>`;
    }

    /**
     * Recent dictations: time, two-line text, Copy on hover.
     * Data: Bridge.stats.getHistory() -> stats.recentTranscripts (newest first).
     */
    function renderRecentCard() {
      const items = Array.isArray(stats.recentTranscripts) ? stats.recentTranscripts : [];
      const rows = items.map((t, i) => `<div class="row">
        <span class="time mono">${esc(t.time || '')}</span>
        <span class="text">${esc(t.fullText || t.text || '')}</span>
        <button class="btn copy" onclick="copyTranscriptItem(${i})">${COPY_ICON}Copy</button>
      </div>`).join('');
      const empty = `<div class="row-empty">
        <span>No dictations yet</span>
        <span class="label">Hold ${esc(hotkeyDisplay(settingsState.hotkey))} and talk. Your takes show up here.</span>
      </div>`;
      return `
    <section class="card recent" data-source="Bridge.stats.getHistory">
      <div class="recent-head">
        <h3>Recent dictations</h3>
        <button class="btn" onclick="copyLast()" ${items.length ? '' : 'disabled'}>${COPY_ICON}Copy last</button>
      </div>
      ${rows || empty}
    </section>`;
    }

    /**
     * Composes the full Home view from sub-renderers.
     * This is the entry point called by renderContent() when currentView === 'home'.
     */
    function renderHome() {
      return `
    <section class="home-view">
      ${renderHomeHeader()}
      ${renderHeroCard()}
      ${renderChartCard()}
      ${renderRecentCard()}
    </section>`;
    }

    // ================================================================
    // Snippets and Dictionary. Same header, card, row and button
    // patterns as Home (Main.dc.html); the inputs follow the control
    // values in SettingsPage.dc.html. Form first, list under it.
    // Every snippet is stored with scope "personal" (gui_host.add_snippet
    // never passes a scope), so there is no scope filter to render.
    // ================================================================

    function renderViewHead(title, subline) {
      return `
    <header class="view-head">
      <div class="view-title"><h2>${esc(title)}</h2><span class="view-sub">${esc(subline)}</span></div>
    </header>`;
    }

    function renderSnippets() {
      const rows = snippets.map((x) => `<div class="row snippet">
        <span class="trigger mono">"${esc(x.trigger)}"</span>
        <span class="text">${esc(x.replacement)}</span>
        <span class="row-actions">
          <button class="btn" onclick="copySnippet(${Number(x.id)})">${COPY_ICON}Copy</button>
          <button class="btn" onclick="deleteSnippet(${Number(x.id)})">Delete</button>
        </span>
      </div>`).join('');
      const empty = `<div class="row-empty">
        <span>No snippets yet</span>
        <span class="label">Add a trigger above. Say it while dictating and the replacement gets typed instead.</span>
      </div>`;
      return `
    <section class="snippets-view">
      ${renderViewHead('Snippets', 'Say the trigger, Impulse types the replacement.')}
      <form class="card add-form snippet-form" onsubmit="event.preventDefault();addSnippet();">
        <input id="snippet-trigger-input" class="field" type="text" placeholder="If I say..." autocomplete="off" spellcheck="false">
        <input id="snippet-replacement-input" class="field" type="text" placeholder="Type this..." autocomplete="off">
        <button type="submit" class="btn primary">Add</button>
      </form>
      <section class="card list" data-source="Bridge.settings.getSnippets">${rows || empty}</section>
    </section>`;
    }

    function normalizeVocabularyWord(v) { return String(v || '').trim().replace(/\s+/g, ' '); }

    // Rows carry no action: the bridge has add_vocabulary_word but no
    // remove call, so nothing is invented here.
    function renderDictionary() {
      const rows = vocabularyWords.map((w) => `<div class="row word"><span class="text">${esc(w)}</span></div>`).join('');
      const empty = `<div class="row-empty">
        <span>No words yet</span>
        <span class="label">Add the names and jargon Whisper keeps getting wrong.</span>
      </div>`;
      return `
    <section class="dictionary-view">
      ${renderViewHead('Dictionary', 'Names and jargon Whisper should get right.')}
      <form class="card add-form word-form" onsubmit="event.preventDefault();addVocabularyWord();">
        <input id="dictionary-word-input" class="field" type="text" placeholder="Add a word or phrase" autocomplete="off">
        <button type="submit" class="btn primary">Add</button>
      </form>
      <section class="card list" data-source="Bridge.settings.getVocabulary">${rows || empty}</section>
    </section>`;
    }

    function renderContent() {
      const content = document.getElementById('tab-content');
      if (!content) return;
      const y = content.scrollTop;
      content.innerHTML = currentView === 'snippets' ? renderSnippets()
        : currentView === 'dictionary' ? renderDictionary()
        : currentView === 'settings' ? renderSettings()
        : renderHome();
      updateSidebar();
      updateNav();
      content.scrollTop = y;
    }

    // ================================================================
    // Settings view. Markup and control values lifted from
    // docs/design/canvas-2026-09/SettingsPage.dc.html: page title with
    // the tab row at its right, a .card of .setting rows, an uppercase
    // section label before the Audio card. Model, Data and License reuse
    // the same row pattern. Audio lives inside General as in the canvas.
    // ================================================================

    const SETTINGS_TABS = [
      { id: 'general', label: 'General' },
      { id: 'models', label: 'Model' },
      { id: 'data', label: 'Data' },
      { id: 'license', label: 'License' }
    ];
    const MODEL_OPTIONS = [
      { id: 'auto', title: 'Auto', desc: 'Picks the best model for this machine (recommended).' },
      { id: 'turbo', title: 'Turbo', desc: 'Highest accuracy. Needs a GPU to stay fast.' },
      { id: 'base', title: 'Base', desc: 'Fast and light. Best on machines without a GPU.' }
    ];
    // Real range inputs; min/max drive the accent fill, text formats the readout.
    const SLIDERS = {
      vadSensitivity: { min: 1, max: 100, step: 1, text: (v) => String(Math.round(v)) },
      vadSilenceMs: { min: 250, max: 2000, step: 50, text: (v) => (Number(v) / 1000).toFixed(1) + 's' }
    };
    const CHEVRON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>';

    const settingRow = (name, help, control) => `<div class="setting">
        <div class="setting-text"><div class="name">${esc(name)}</div>${help ? `<div class="help">${esc(help)}</div>` : ''}</div>
        ${control ? `<div class="setting-control">${control}</div>` : ''}
      </div>`;
    const toggleControl = (key, on, label) => `<button type="button" class="toggle${on ? ' on' : ''}" role="switch" aria-checked="${on ? 'true' : 'false'}" aria-label="${esc(label)}" onclick="toggleSetting('${key}')"></button>`;
    const segControl = (key, options, current, label) => `<span class="seg" role="radiogroup" aria-label="${esc(label)}">${options.map((o) => `<button type="button" class="${o.value === current ? 'on' : ''}" role="radio" aria-checked="${o.value === current ? 'true' : 'false'}" onclick="updateSetting('${key}', '${esc(o.value)}')">${esc(o.label)}</button>`).join('')}</span>`;
    const selectControl = (key, options, current, label) => {
      const found = options.find((o) => o.value === current);
      return `<span class="select"><span class="select-label">${esc(found ? found.label : current)}</span>${CHEVRON_ICON}<select aria-label="${esc(label)}" onchange="updateSetting('${key}', this.value)">${options.map((o) => `<option value="${esc(o.value)}" ${o.value === current ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select></span>`;
    };
    // The thumb travels (track - 14 px), so the fill ends under its centre.
    const sliderFill = (key, value) => {
      const s = SLIDERS[key];
      const pct = Math.max(0, Math.min(1, (Number(value) - s.min) / (s.max - s.min)));
      return `calc((100% - 14px) * ${pct.toFixed(4)} + 7px)`;
    };
    const sliderControl = (key, label) => {
      const s = SLIDERS[key];
      const value = Number(settingsState[key]);
      return `<span class="track"><i id="fill-${key}" style="width:${sliderFill(key, value)};"></i><input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${value}" aria-label="${esc(label)}" oninput="updateSetting('${key}', this.value, true)"></span><span class="mono track-value" id="value-${key}">${esc(s.text(value))}</span>`;
    };

    function renderGeneralTab() {
      const recordKeys = hotkeyDisplay(settingsState.hotkey).split(' + ').filter(Boolean);
      const draftKeys = hotkeyRecording ? hotkeyDisplay(hotkeyCaptureDraft.join('+')).split(' + ').filter(Boolean) : [];
      const recordControl = `<span class="keys" id="hotkey-record-keys">${kbdCaps(draftKeys.length ? draftKeys : recordKeys)}</span><button class="btn${hotkeyRecording ? ' is-recording' : ''}" onclick="toggleHotkeyRecording()">${hotkeyRecording ? 'Press keys...' : 'Change'}</button>`;
      const micOptions = microphones.map((m) => ({ value: m, label: m }));
      if (!micOptions.some((o) => o.value === settingsState.microphone)) micOptions.unshift({ value: settingsState.microphone, label: settingsState.microphone });
      const themeOptions = [{ value: 'system', label: 'System' }, { value: 'dark', label: 'Dark' }, { value: 'light', label: 'Light' }];

      const general = `<div class="card settings-card">
        ${settingRow('Record shortcut', 'Hold to dictate. Release to paste.', recordControl)}
        ${settingRow('Hands-free shortcut', 'Tap once to start, tap again to stop.', `<span class="keys">${kbdCaps([...recordKeys, 'Alt'])}</span>`)}
        ${settingRow('Start with Windows', 'Launch minimized to the tray at sign-in.', toggleControl('launchBehavior', settingsState.launchBehavior === 'start_minimized', 'Start with Windows'))}
        ${settingRow('Copy each dictation to the clipboard', 'In addition to pasting it where the cursor is.', toggleControl('autoCopy', settingsState.autoCopy, 'Copy each dictation to the clipboard'))}
        ${settingRow('Command mode', 'Edit and interact with voice commands.', toggleControl('commandMode', settingsState.commandMode, 'Command mode'))}
        ${settingRow('Appearance', 'Follows Windows by default.', segControl('theme', themeOptions, normalizeTheme(settingsState.theme), 'Appearance'))}
      </div>`;

      const audio = `<div class="section-label">Audio</div>
      <div class="card settings-card">
        ${settingRow('Microphone', 'Which input Impulse listens to.', selectControl('microphone', micOptions, settingsState.microphone, 'Microphone'))}
        ${settingRow('Sensitivity', 'Higher picks up quieter speech.', sliderControl('vadSensitivity', 'Sensitivity'))}
        ${settingRow('Stop after silence', 'How long a pause ends a hands-free take.', sliderControl('vadSilenceMs', 'Stop after silence'))}
      </div>`;

      // Only when the stored endpoint answered /api/tags on open.
      const stylization = !ollamaReachable ? '' : `<div class="section-label">Stylization</div>
      <div class="card settings-card">
        ${settingRow('Stylization profile', 'Clean removes fillers. Polished adds a light grammar pass through Ollama. Ctrl + Win + Shift cycles.', selectControl('stylizationProfile', [{ value: 'off', label: 'Off' }, { value: 'clean', label: 'Clean' }, { value: 'polished', label: 'Polished' }], settingsState.stylizationProfile, 'Stylization profile'))}
        ${settingRow('Ollama model', 'Model used for the polished profile.', `<input type="text" class="field" style="width:160px;" value="${esc(settingsState.ollamaModel)}" aria-label="Ollama model" onchange="updateSetting('ollamaModel', this.value)">`)}
        ${settingRow('Ollama endpoint', 'Base URL for the Ollama API.', `<input type="text" class="field" style="width:220px;" value="${esc(settingsState.ollamaEndpoint)}" aria-label="Ollama endpoint" onchange="updateSetting('ollamaEndpoint', this.value)">`)}
      </div>`;

      return general + audio + stylization;
    }

    function renderModelsTab() {
      const vram = settingsState.vramTotalGb > 0 ? `, ${settingsState.vramTotalGb.toFixed(1)} GB VRAM` : '';
      const current = `Currently ${modelLabel(settingsState.activeModel).toLowerCase()}${vram}`;
      const rows = MODEL_OPTIONS.map((m) => {
        const on = settingsState.modelMode === m.id;
        return `<button type="button" class="setting choice${on ? ' on' : ''}" role="radio" aria-checked="${on ? 'true' : 'false'}" onclick="selectModel('${m.id}')">
          <div class="setting-text"><div class="name">${esc(m.title)}</div><div class="help">${esc(m.desc)}</div></div>
          <span class="check" aria-hidden="true"></span>
        </button>`;
      }).join('');
      return `<div class="settings-current">${esc(current)}</div><div class="card settings-card" role="radiogroup" aria-label="Model">${rows}</div>`;
    }

    function renderDataTab() {
      const snapshot = `${fmtInt(stats.totalWords)} total words, ${(stats.recentTranscripts || []).length} recent transcripts.`;
      return `<div class="card settings-card">
        ${settingRow('Export history', 'Transcripts and snippets as a CSV.', `<button class="btn" onclick="exportHistory()">Export</button>`)}
        ${settingRow('Share telemetry', 'Opt in to anonymous crash/error diagnostics and setup-progress events (install, activation, first dictation). No audio or transcript content is ever sent.', toggleControl('telemetryEnabled', settingsState.telemetryEnabled, 'Share telemetry'))}
        ${settingRow('Snapshot', snapshot, '')}
      </div>`;
    }

    function renderLicenseTab() {
      const valid = Boolean(licenseState.is_valid);
      const betaMessage = betaExpiryMessage();
      const statusHelp = licenseState.message || (valid ? 'License validated and dictation is unlocked.' : 'Enter your license key to unlock dictation.');
      const status = `<div class="card settings-card">
        <div class="setting"><div class="setting-text"><div class="name ${valid ? 'status-on' : 'status-off'}">${valid ? 'Active' : 'Not active'}</div><div class="help">${esc(statusHelp)}</div></div></div>
        ${betaMessage ? settingRow('Beta window', betaMessage, '') : ''}
        ${licenseState.expires_at ? settingRow('Expires at', String(licenseState.expires_at), '') : ''}
      </div>`;

      const editing = valid && licenseEditingForKey !== null && licenseEditingForKey === licenseState.key;
      const keyField = `<input type="text" id="settings-license-key" class="field" placeholder="License key" aria-label="License key" autocomplete="off" spellcheck="false"><button class="btn primary" onclick="activateLicenseSettings()">Activate</button>`;
      let keyRow;
      if (!valid) {
        keyRow = settingRow('License key', 'Enter your license key to unlock.', keyField);
      } else if (editing) {
        keyRow = settingRow('License key', 'Enter a new key to replace the current one.', `${keyField}<button class="btn" onclick="setLicenseKeyEditing(false)">Cancel</button>`);
      } else {
        keyRow = settingRow('License key', String(licenseState.key || 'Hidden'), `<button class="btn" onclick="setLicenseKeyEditing(true)">Change</button><button class="btn" onclick="deactivateLicense()">Deactivate</button>`);
      }
      const key = `<div class="card settings-card">${keyRow}</div>`;
      const about = `<div class="card settings-card">${settingRow('About Impulse', appVersion ? `Version ${appVersion}` : '', '')}</div>`;
      return status + key + about;
    }

    function renderSettings() {
      const tabs = SETTINGS_TABS.map((t) => `<button class="tab${settingsTab === t.id ? ' active' : ''}" onclick="setSettingsTab('${t.id}')">${esc(t.label)}</button>`).join('');
      const body = settingsTab === 'models' ? renderModelsTab()
        : settingsTab === 'data' ? renderDataTab()
        : settingsTab === 'license' ? renderLicenseTab()
        : renderGeneralTab();
      return `
    <section class="settings-view">
      <header class="settings-head">
        <h2>Settings</h2>
        <div class="tabs">${tabs}</div>
      </header>
      ${body}
    </section>`;
    }

    // Re-renders the Settings view when it is on screen. Kept under the
    // old name so every caller (model, hotkey and license refreshes) is
    // unchanged.
    function renderSettingsPanel() { if (currentView === 'settings') scheduleRender(); }

    function setLicenseKeyEditing(on) {
      licenseEditingForKey = on ? licenseState.key : null;
      renderSettingsPanel();
    }

    async function loadOllamaReachability() {
      const reachable = Bridge.ready() ? Boolean(await Bridge.settings.checkOllama()) : false;
      if (reachable === ollamaReachable) return;
      ollamaReachable = reachable;
      renderSettingsPanel();
    }

    async function loadAppVersion() {
      if (appVersion) return;
      const v = await Bridge.settings.getAppVersion();
      if (!v) return;
      appVersion = String(v);
      renderSettingsPanel();
    }

    function setSettingsTab(t) { settingsTab = t; setHotkeyRecording(false); renderSettingsPanel(); }
    // Sliders (n = true) update their fill and readout in place: a re-render
    // mid-drag would replace the input under the pointer.
    function updateSetting(k, v, n = false) {
      settingsState[k] = n ? Number(v) : v;
      if (n && SLIDERS[k]) {
        const e = document.getElementById('value-' + k);
        if (e) e.textContent = SLIDERS[k].text(settingsState[k]);
        const fill = document.getElementById('fill-' + k);
        if (fill) fill.style.width = sliderFill(k, settingsState[k]);
      } else {
        if (k === 'theme') applyTheme(settingsState[k]);
        renderSettingsPanel();
      }
      persistSettingToBackend(k, settingsState[k]);
    }
    // Start with Windows is the stored launch_behavior string: on is
    // start_minimized, off is open_dashboard. The other toggles are booleans.
    function toggleSetting(k) {
      if (k === 'launchBehavior') settingsState.launchBehavior = settingsState.launchBehavior === 'start_minimized' ? 'open_dashboard' : 'start_minimized';
      else settingsState[k] = !settingsState[k];
      renderSettingsPanel();
      persistSettingToBackend(k, settingsState[k]);
    }

    async function persistSettingToBackend(key, value) {
      const backendKeyMap = {
        launchBehavior: 'launch_behavior', theme: 'theme',
        commandMode: 'command_mode', autoCopy: 'auto_copy',
        stylizationProfile: 'stylization_profile',
        ollamaModel: 'ollama_model',
        ollamaEndpoint: 'ollama_endpoint',
        microphone: 'input_device', vadSensitivity: 'vad_sensitivity',
        vadSilenceMs: 'vad_silence_ms',
        telemetryEnabled: 'telemetry_enabled',
      };
      await Bridge.settings.update(backendKeyMap[key] || key, value);
    }

    // Stored values: 'system' (default), 'dark', 'light'. The old theme ids
    // (hot_pink, neon_dark, midnight_green) all resolve to dark so existing
    // settings files keep working; settings_manager.py rewrites them on load.
    const systemThemeQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: light)') : null;
    function normalizeTheme(name) {
      return (name === 'light' || name === 'dark' || name === 'system') ? name : 'dark';
    }
    function applyTheme(name) {
      name = normalizeTheme(name);
      settingsState.theme = name;
      let resolved = name;
      if (name === 'system') resolved = (systemThemeQuery && systemThemeQuery.matches) ? 'light' : 'dark';
      document.documentElement.dataset.theme = resolved;
      document.body.dataset.theme = resolved;
    }
    if (systemThemeQuery) {
      const onSystemThemeChange = () => { if (settingsState.theme === 'system') applyTheme('system'); };
      if (systemThemeQuery.addEventListener) systemThemeQuery.addEventListener('change', onSystemThemeChange);
      else if (systemThemeQuery.addListener) systemThemeQuery.addListener(onSystemThemeChange);
    }

    function applyModelSettingsPayload(payload, emitAutoToast = false) {
      if (!payload || typeof payload !== 'object') return;
      const prevMode = settingsState.modelMode;
      const prevManual = settingsState.manualModel;
      const prevActive = settingsState.activeModel;
      const prevVram = settingsState.vramTotalGb;
      settingsState.modelMode = String(payload.mode || settingsState.modelMode || 'auto').toLowerCase();
      settingsState.manualModel = String(payload.manualModel || settingsState.manualModel || 'base').toLowerCase();
      settingsState.activeModel = String(payload.activeModel || settingsState.activeModel || 'base').toLowerCase();
      settingsState.vramTotalGb = Number(payload.vramTotalGb || 0);
      const changed = (
        prevMode !== settingsState.modelMode
        || prevManual !== settingsState.manualModel
        || prevActive !== settingsState.activeModel
        || prevVram !== settingsState.vramTotalGb
      );
      if (changed && settingsTab === 'models') renderSettingsPanel();
      if (emitAutoToast && settingsState.modelMode === 'auto' && payload.autoSwitched) {
        showToast(`Switched to ${modelLabel(settingsState.activeModel)}.`);
      }
    }

    async function selectModel(m) {
      settingsState.modelMode = String(m || '').toLowerCase();
      renderSettingsPanel();
      const payload = await Bridge.transcription.setModelMode(settingsState.modelMode);
      if (payload) {
        applyModelSettingsPayload(payload, true);
        if (settingsState.modelMode !== 'auto') showToast('Model set to ' + modelLabel(settingsState.modelMode));
      } else if (!Bridge.ready()) {
        showToast('Model set to ' + modelLabel(settingsState.modelMode));
      } else {
        showToast('Failed to update model');
      }
    }

    function setHotkeyRecording(v) {
      hotkeyRecording = Boolean(v);
      if (!hotkeyRecording) {
        hotkeyCapturePressed = new Set();
        hotkeyCaptureDraft = [];
      }
      renderSettingsPanel();
    }

    async function saveHotkeySetting(value) {
      const normalized = String(value || '').toLowerCase();
      if (!Bridge.ready()) {
        settingsState.hotkey = normalized || settingsState.hotkey;
        updateListeningLabel();
        renderSettingsPanel();
        showToast('Shortcut updated');
        return true;
      }
      const result = await Bridge.settings.setHotkey(normalized);
      if (!result || !result.ok) {
        showToast((result && result.error) ? result.error : 'Invalid shortcut');
        return false;
      }
      settingsState.hotkey = String(result.hotkey || settingsState.hotkey);
      updateListeningLabel();
      renderSettingsPanel();
      showToast('Shortcut set to ' + hotkeyDisplay(settingsState.hotkey));
      return true;
    }

    function finalizeRecordedHotkey() {
      const ordered = orderHotkeyTokens(hotkeyCaptureDraft);
      setHotkeyRecording(false);
      if (!isValidHotkeyTokens(ordered)) {
        showToast('Use at least one modifier key (Ctrl/Alt/Shift/Win).');
        return;
      }
      const combo = ordered.join('+');
      saveHotkeySetting(combo);
    }

    function toggleHotkeyRecording() {
      if (hotkeyRecording) {
        setHotkeyRecording(false);
        return;
      }
      hotkeyCapturePressed = new Set();
      hotkeyCaptureDraft = [];
      setHotkeyRecording(true);
    }

    function onHotkeyCaptureKeyDown(e) {
      if (!hotkeyRecording) return;
      const key = hotkeyTokenFromEvent(e);
      if (!key) return;
      e.preventDefault();
      e.stopPropagation();
      hotkeyCapturePressed.add(key);
      hotkeyCaptureDraft = orderHotkeyTokens(Array.from(hotkeyCapturePressed));
      const keys = document.getElementById('hotkey-record-keys');
      if (keys) keys.innerHTML = kbdCaps(hotkeyDisplay(hotkeyCaptureDraft.join('+')).split(' + ').filter(Boolean));
    }

    function onHotkeyCaptureKeyUp(e) {
      if (!hotkeyRecording) return;
      const key = hotkeyTokenFromEvent(e);
      if (!key) return;
      e.preventDefault();
      e.stopPropagation();
      hotkeyCapturePressed.delete(key);
      if (hotkeyCaptureDraft.length > 0 && hotkeyCapturePressed.size === 0) {
        finalizeRecordedHotkey();
      }
    }

    // Settings is a view. This stays a named global because the sidebar row
    // and the gui_host open_settings bridge method both address it by name.
    function openSettings() {
      settingsTab = 'general';
      setHotkeyRecording(false);
      switchView('settings');
    }

    // Reads the add form; a successful add re-renders the view, which
    // rebuilds (and so clears) the form. Failures leave the text in place.
    async function addSnippet() {
      const triggerInput = document.getElementById('snippet-trigger-input');
      const replacementInput = document.getElementById('snippet-replacement-input');
      const t = String(triggerInput ? triggerInput.value : '').trim();
      const r = String(replacementInput ? replacementInput.value : '').trim();
      if (!t) { if (triggerInput) triggerInput.focus(); return; }
      if (!r) { if (replacementInput) replacementInput.focus(); return; }
      const result = await Bridge.settings.addSnippet(t, r);
      if (result && result.ok && Array.isArray(result.snippets)) {
        snippets = result.snippets;
        updateSidebar();
        renderIfCurrentViewIn(['snippets']);
        showToast('Snippet added');
        return;
      }
      if (result) { showToast(result.error || 'Failed to add snippet'); return; }
      snippets.unshift({ id: Date.now(), scope: 'personal', trigger: t, replacement: r });
      updateSidebar();
      renderIfCurrentViewIn(['snippets']);
      showToast('Snippet added');
    }

    async function deleteSnippet(id) {
      const result = await Bridge.settings.deleteSnippet(id);
      if (result && result.ok && Array.isArray(result.snippets)) {
        snippets = result.snippets;
      } else {
        snippets = snippets.filter((x) => x.id !== id);
      }
      updateSidebar();
      renderIfCurrentViewIn(['snippets']);
      showToast('Snippet deleted');
    }

    async function addVocabularyWord() {
      const input = document.getElementById('dictionary-word-input');
      const raw = input ? input.value : '';
      const word = normalizeVocabularyWord(raw);
      if (!word) return;
      const result = await Bridge.settings.addWord(word);
      if (result && Array.isArray(result.words)) {
        vocabularyWords = result.words;
        if (input) input.value = '';
        updateSidebar();
        renderIfCurrentViewIn(['dictionary']);
        showToast(result.added ? `Added "${word}"` : `"${word}" already exists`);
        return;
      }
      if (!vocabularyWords.some((w) => w.toLowerCase() === word.toLowerCase())) {
        vocabularyWords.push(word);
        showToast(`Added "${word}"`);
      } else {
        showToast(`"${word}" already exists`);
      }
      if (input) input.value = '';
      updateSidebar();
      renderIfCurrentViewIn(['dictionary']);
    }

    async function copyText(txt) {
      const v = String(txt || '');
      if (!v) return false;
      const ok = await Bridge.system.copyText(v);
      if (ok) return true;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try { await navigator.clipboard.writeText(v); return true; } catch { }
      }
      return false;
    }

    async function copyTranscriptItem(i) { const t = (stats.recentTranscripts || [])[i]; if (!t) return; if (await copyText(t.fullText || t.text || '')) showToast('Transcript copied'); }
    async function copySnippet(id) { const s = snippets.find((x) => x.id === id); if (!s) return; if (await copyText(s.replacement)) showToast('Snippet copied'); }
    function copyLast() { if ((stats.recentTranscripts || []).length > 0) copyTranscriptItem(0); }

    function mountAnimatedNode(container, node, ttlMs = 2300) {
      if (!container || !node) return;
      container.appendChild(node);
      requestAnimationFrame(() => node.classList.add('is-visible'));
      setTimeout(() => {
        node.classList.remove('is-visible');
        setTimeout(() => { if (node.parentNode) node.parentNode.removeChild(node); }, 220);
      }, ttlMs);
    }

    function showToast(msg) {
      const c = document.getElementById('toast-container');
      if (!c) return;
      const t = document.createElement('div');
      t.className = 'toast-notification';
      t.textContent = msg;
      mountAnimatedNode(c, t, 2300);
    }

    function minimizeWindow() { Bridge.system.minimize(); }
    function closeWindow() { if (Bridge.ready()) Bridge.system.close(); else window.close(); }

    async function exportHistory() {
      const result = await Bridge.system.exportCsv();
      if (result && result.ok) {
        showToast('CSV exported to ' + (result.path || 'exports folder'));
        return;
      }
      if (result) { showToast(result.error || 'Export failed'); return; }
      const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), stats, recentTranscripts: stats.recentTranscripts || [], snippets }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'whisper_local_history_' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('History exported');
    }

    // The JSON stats payload (get_stats / dashboard_stats.js) still carries
    // the old XP fields; Home only reads the streak and the recent takes.
    function applyJsonStats(data) {
      stats.dayStreak = Number(data.dayStreak) || 0;
      stats.recentTranscripts = Array.isArray(data.recentTranscripts) ? data.recentTranscripts : [];
      lastRecentDigest = digest(stats.recentTranscripts.map((t) => t.fullText || t.text || ''));
      renderIfCurrentViewIn(['home']);
    }

    function loadStatsFromJSFile() {
      if (!window.WHISPER_STATS) return false;
      const d = digest(window.WHISPER_STATS);
      if (d === lastStatsDigest) return true;
      lastStatsDigest = d;
      applyJsonStats(window.WHISPER_STATS);
      return true;
    }

    async function loadStatsFromPython() {
      if (!Bridge.ready()) { loadStatsFromJSFile(); return; }
      const data = await Bridge.stats.get();
      if (!data) { loadStatsFromJSFile(); return; }
      const d = digest(data);
      if (d === lastStatsDigest) return;
      lastStatsDigest = d;
      applyJsonStats(data);
    }

    async function loadRecentTranscriptionsFromPython() {
      const recent = await Bridge.stats.getHistory();
      if (!Array.isArray(recent)) return;
      const d = digest(recent.map((t) => t.fullText || t.text || ''));
      if (d === lastRecentDigest) return;
      stats.recentTranscripts = recent;
      lastRecentDigest = d;
      renderIfCurrentViewIn(['home']);
    }

    async function loadModelSettingsFromPython() {
      const payload = await Bridge.transcription.getModelMode();
      if (!payload) return;
      const d = digest(payload);
      if (d === lastModelSettingsDigest) return;
      lastModelSettingsDigest = d;
      applyModelSettingsPayload(payload, true);
    }

    async function loadVocabularyFromPython() {
      const words = await Bridge.settings.getVocabulary();
      if (!Array.isArray(words)) return;
      const d = digest(words);
      if (d === lastVocabularyDigest) return;
      lastVocabularyDigest = d;
      vocabularyWords = words;
      updateSidebar();
      renderIfCurrentViewIn(['dictionary']);
    }

    async function loadHotkeyFromPython() {
      const payload = await Bridge.settings.getHotkey();
      if (!payload || !payload.ok) return;
      const nextHotkey = String(payload.hotkey || '').toLowerCase();
      const d = digest(nextHotkey);
      if (d === lastHotkeyDigest) return;
      lastHotkeyDigest = d;
      settingsState.hotkey = nextHotkey || settingsState.hotkey;
      updateListeningLabel();
      renderSettingsPanel();
    }

    async function loadSnippetsFromPython() {
      const items = await Bridge.settings.getSnippets();
      if (!Array.isArray(items)) return;
      const d = digest(items);
      if (d === lastSnippetsDigest) return;
      lastSnippetsDigest = d;
      snippets = items;
      updateSidebar();
      renderIfCurrentViewIn(['snippets']);
    }

    async function loadUserSettingsFromPython() {
      const result = await Bridge.settings.getAll();
      if (!result || !result.ok || !result.settings) return;
      const d = digest(result.settings);
      if (d === lastUserSettingsDigest) return;
      lastUserSettingsDigest = d;
      const s = result.settings;
      if (s.launch_behavior) settingsState.launchBehavior = s.launch_behavior;
      if (s.theme) { settingsState.theme = s.theme; applyTheme(s.theme); }
      if (typeof s.command_mode === 'boolean') settingsState.commandMode = s.command_mode;
      if (typeof s.auto_copy === 'boolean') settingsState.autoCopy = s.auto_copy;
      if (s.input_device) settingsState.microphone = s.input_device;
      if (typeof s.vad_sensitivity === 'number') settingsState.vadSensitivity = s.vad_sensitivity;
      if (typeof s.vad_silence_ms === 'number') settingsState.vadSilenceMs = s.vad_silence_ms;
      if (s.stylization_profile) settingsState.stylizationProfile = s.stylization_profile;
      if (s.ollama_model) settingsState.ollamaModel = s.ollama_model;
      if (s.ollama_endpoint) settingsState.ollamaEndpoint = s.ollama_endpoint;
      if (typeof s.telemetry_enabled === 'boolean') settingsState.telemetryEnabled = s.telemetry_enabled;
    }

    // ================================================================
    // SQLite-backed loaders – call the new Bridge.stats paths that
    // read from the StatsController (WAL-mode SQLite).
    // These run alongside loadStatsFromPython() and progressively
    // replace JSON-sourced data with SQLite-sourced data.
    // ================================================================

    let lastChartDataDigest = '';
    let lastHomeSummaryDigest = '';

    async function loadChartDataFromSqlite() {
      const data = await Bridge.stats.getChartData(14);
      if (!data) return;
      const d = digest(data);
      if (d === lastChartDataDigest) return;
      lastChartDataDigest = d;
      const converted = chartDataToSeries(data);
      if (converted) {
        stats.last14Days = converted;
        renderIfCurrentViewIn(['home']);
      }
    }

    async function loadHomeSummaryFromSqlite() {
      const summary = await Bridge.stats.getHomeSummary();
      if (!summary || typeof summary !== 'object') return;
      const d = digest(summary);
      if (d === lastHomeSummaryDigest) return;
      lastHomeSummaryDigest = d;
      stats.todayWords = Number(summary.todayWords) || 0;
      stats.todayTakes = Number(summary.todayTakes) || 0;
      stats.bestDay = summary.bestDay && typeof summary.bestDay === 'object'
        ? { words: Number(summary.bestDay.words) || 0, date: summary.bestDay.date || null }
        : { words: 0, date: null };
      stats.totalWords = Number(summary.totalWords) || 0;
      stats.totalSessions = Number(summary.totalSessions) || 0;
      stats.avgWpm = Number(summary.avgWpm) || 0;
      renderIfCurrentViewIn(['home']);
    }

    async function verifyBridgeHealth() { await Bridge.system.ping(); }

    async function checkPaywall() {
      const overlay = document.getElementById('paywall-overlay');
      if (!overlay) return;
      if (licenseState.is_valid) {
        overlay.style.display = 'none';
      } else {
        overlay.style.display = 'flex';
      }
    }

    async function loadLicenseStateFromPython() {
      if (!Bridge.ready()) return;
      const status = await Bridge.licensing.getStatus();
      if (!status) return;
      const changed = (licenseState.is_valid !== status.is_valid || licenseState.key !== status.key);
      licenseState = status;
      if (changed) {
        if (settingsTab === 'license') renderSettingsPanel();
        checkPaywall();
      }
    }

    async function handleLicenseActivation(key, errorElemId) {
      if (!key) return;
      const result = await Bridge.licensing.activate(key);
      if (result && result.success) {
        licenseState = result.status || licenseState;
        checkPaywall();
        if (settingsTab === 'license') renderSettingsPanel();
        showToast('License Activated!');
        const errElem = document.getElementById(errorElemId);
        if (errElem) errElem.style.display = 'none';
      } else {
        const errElem = document.getElementById(errorElemId);
        if (errElem) {
          errElem.textContent = result ? result.message : 'Activation failed';
          errElem.style.display = 'block';
        } else {
          showToast('Activation failed');
        }
      }
    }

    window.activateFromPaywall = function () {
      const key = document.getElementById('paywall-key').value;
      handleLicenseActivation(key, 'paywall-error');
    };

    window.activateLicenseSettings = function () {
      const key = document.getElementById('settings-license-key').value;
      handleLicenseActivation(key, null);
    };

    window.deactivateLicense = async function () {
      const result = await Bridge.licensing.deactivate();
      if (result) {
        licenseState = result.status || licenseState;
        checkPaywall();
        if (settingsTab === 'license') renderSettingsPanel();
        showToast('License Deactivated');
      }
    };

    window.addEventListener('keydown', onHotkeyCaptureKeyDown, true);
    window.addEventListener('keyup', onHotkeyCaptureKeyUp, true);

    window.addEventListener('DOMContentLoaded', () => {
      applyTheme(settingsState.theme);
      updateListeningLabel();
      renderContent();
      lastStatsDigest = digest(stats);
      lastRecentDigest = digest((stats.recentTranscripts || []).map((t) => t.fullText || t.text || ''));
      lastHotkeyDigest = digest(settingsState.hotkey);

      async function pollPythonData() {
        if (pollBusy || document.hidden || !document.hasFocus()) return;
        pollBusy = true;
        try {
          pollTick += 1;
          const jobs = [];
          const shouldPollStats = currentView === 'home' || (pollTick % 15 === 0);
          const shouldPollModels = isModelsSettingsVisible() || (pollTick % 30 === 0);
          const shouldPollVocabulary = currentView === 'dictionary' || (pollTick % 30 === 0);
          const shouldPollHotkey = isSettingsTabVisible('general') || (pollTick % 30 === 0);
          const shouldPollSnippets = currentView === 'snippets' || (pollTick % 30 === 0);
          const shouldPollUserSettings = (pollTick % 60 === 0);

          if (shouldPollStats) {
            jobs.push(loadStatsFromPython());
            jobs.push(loadChartDataFromSqlite());
            jobs.push(loadHomeSummaryFromSqlite());
          }
          if (currentView === 'home') jobs.push(loadRecentTranscriptionsFromPython());
          if (shouldPollModels) jobs.push(loadModelSettingsFromPython());
          if (shouldPollVocabulary) jobs.push(loadVocabularyFromPython());
          if (shouldPollHotkey) jobs.push(loadHotkeyFromPython());
          if (shouldPollSnippets) jobs.push(loadSnippetsFromPython());
          if (shouldPollUserSettings) jobs.push(loadUserSettingsFromPython());
          if (pollTick % 60 === 0) jobs.push(loadLicenseStateFromPython());

          if (jobs.length === 0) return;
          await Promise.allSettled(jobs);
        } finally {
          pollBusy = false;
        }
      }

      function startPyPoll() {
        if (pythonPollingStarted) return false;
        if (!Bridge.ready()) return false;
        pythonPollingStarted = true;
        loadStatsFromPython();
        loadChartDataFromSqlite();
        loadHomeSummaryFromSqlite();
        loadRecentTranscriptionsFromPython();
        loadModelSettingsFromPython();
        loadVocabularyFromPython();
        loadHotkeyFromPython();
        loadSnippetsFromPython();
        loadUserSettingsFromPython();
        loadLicenseStateFromPython();
        verifyBridgeHealth();
        setInterval(() => { pollPythonData(); }, PY_POLL_MS);
        return true;
      }

      function startFallback() { setTimeout(() => { loadStatsFromJSFile(); }, 120); }

      window.addEventListener('pywebviewready', () => { startPyPoll(); });

      if (startPyPoll()) return;
      let tries = 0;
      const probe = setInterval(() => {
        if (startPyPoll()) { clearInterval(probe); return; }
        tries += 1;
        if (tries >= 6) { clearInterval(probe); startFallback(); }
      }, 500);
    });
  </script>
</body>

</html>
